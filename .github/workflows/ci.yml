name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_NO_ANALYTICS: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Unit and widget tests
        run: flutter test
      - name: Security and wiring gates (explicit)
        run: |
          flutter test \
            test/security_denial_test.dart \
            test/rls_admin_gating_test.dart \
            test/admin_route_guard_test.dart \
            test/supabase_repository_contract_test.dart \
            test/storage_security_test.dart \
            test/rls_migration_contract_test.dart \
            test/environment_project_ref_test.dart \
            test/production_boot_test.dart
      - name: Config guards (staging)
        run: flutter test test/config_guard_test.dart --dart-define=HVAC_ENV=staging
      - name: Config guards (production)
        run: flutter test test/config_guard_test.dart --dart-define=HVAC_ENV=production

  build-web:
    name: Build web (staging)
    runs-on: ubuntu-latest
    needs: test
    env:
      HVAC_ENV: staging
      # Falls back to placeholders when repo secrets are not configured (PR forks).
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'public-ci-placeholder' }}
      SUPABASE_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || 'example' }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || '' }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web artifact
        run: |
          flutter build web --no-tree-shake-icons \
            --dart-define=HVAC_ENV=${{ env.HVAC_ENV }} \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ env.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_PROJECT_REF=${{ env.SUPABASE_PROJECT_REF }} \
            --dart-define=STAGING_PROJECT_REF=${{ env.STAGING_PROJECT_REF }} \
            --dart-define=PRODUCTION_PROJECT_REF=${{ env.PRODUCTION_PROJECT_REF }}
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-staging-${{ github.sha }}
          path: build/web/
          retention-days: 14
          if-no-files-found: error

  build-windows:
    name: Build Windows (staging)
    runs-on: windows-latest
    needs: test
    env:
      HVAC_ENV: staging
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'public-ci-placeholder' }}
      SUPABASE_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || 'example' }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || '' }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        run: |
          flutter build windows --release `
            --dart-define=HVAC_ENV=$env:HVAC_ENV `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY `
            --dart-define=SUPABASE_PROJECT_REF=$env:SUPABASE_PROJECT_REF `
            --dart-define=STAGING_PROJECT_REF=$env:STAGING_PROJECT_REF `
            --dart-define=PRODUCTION_PROJECT_REF=$env:PRODUCTION_PROJECT_REF
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-staging-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 14
          if-no-files-found: error

  deploy-staging:
    name: Deploy staging (web)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-staging-${{ github.sha }}
          path: web-dist/
      - name: Promote staging-latest artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-staging-latest
          path: web-dist/
          retention-days: 30
          if-no-files-found: error
      - name: Deploy via hook (optional)
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "STAGING_WEB_DEPLOY_HOOK not configured — download web-staging-latest from Actions."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK"
